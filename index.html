<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="RNEDQRJE9taoAZkaUhW0OLCKz6Y6MmXSdgga-F7QpMI" />

  <!-- Favicons (pointent vers des fichiers qui existent réellement) -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/favicon.png">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Autorise l'indexation normale de la page, mais interdit aux moteurs
       de recherche d'utiliser une image du CONTENU de la page comme vignette.
       Seule l'image explicitement choisie via og:image (le logo) peut servir
       de vignette. Confirmé pour Google ; traité en renfort pour les autres
       moteurs, en complément du retrait des photos elles-mêmes. -->
  <meta name="robots" content="index, follow, noimageindex" />

  <!-- SEO TITLE + DESCRIPTION -->
  <title>Marc-Olivier Tessier | Conseiller en sécurité financière</title>
  <meta name="description" content="Marc-Olivier Tessier, conseiller en sécurité financière affilié à iA Groupe financier (agence Les Rivières). Épargne (CELI, REER, CELIAPP), assurances (vie, prêt hypothécaire, invalidité) et solutions pour entreprises. Prise de rendez-vous en ligne.">
  <link rel="canonical" href="https://servicesfinancierstessier.ca/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Services financiers Tessier" />
  <meta property="og:title" content="Marc-Olivier Tessier | Conseiller en sécurité financière – iA Groupe financier" />
  <meta property="og:description" content="Conseils concrets. Résultats durables. Épargne, assurances et solutions d'entreprise." />
  <meta property="og:url" content="https://servicesfinancierstessier.ca/" />
  <meta property="og:locale" content="fr_CA" />

  <!-- Image d'aperçu : logo de la marque -->
  <meta property="og:image" content="https://servicesfinancierstessier.ca/logo-mot.png" />
  <meta property="og:image:secure_url" content="https://servicesfinancierstessier.ca/logo-mot.png" />
  <meta property="og:image:alt" content="Logo Marc-Olivier Tessier Services financiers" />
  <meta property="og:image:width" content="1024" />
  <meta property="og:image:height" content="1024" />

  <!-- Twitter (fallback) -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Marc-Olivier Tessier | Conseiller en sécurité financière – iA Groupe financier" />
  <meta name="twitter:description" content="Conseiller affilié à iA Groupe financier. Épargne, assurances et solutions pour entreprises." />
  <meta name="twitter:image" content="https://servicesfinancierstessier.ca/logo-mot.png" />

  <!-- Fallback pour anciens scrapers -->
  <link rel="image_src" href="https://servicesfinancierstessier.ca/logo-mot.png" />

  <!-- SPA route restore (no change to UI) -->
  <script>
    (function () {
      // Si on arrive avec ?p=/services, réécrit proprement l’URL en /services
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      if (p) {
        var clean = p.replace(/^\//, '/');               // force le slash initial
        var finalUrl = window.location.origin + clean + window.location.hash;
        window.history.replaceState(null, '', finalUrl); // enlève ?p=
      }
    })();
  </script>

  <!-- JSON-LD Structured Data (source unique, domaine correct, logo de marque) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FinancialService",
    "name": "Services financiers Tessier",
    "url": "https://servicesfinancierstessier.ca/",
    "logo": "https://servicesfinancierstessier.ca/logo-mot.png",
    "image": "https://servicesfinancierstessier.ca/logo-mot.png",
    "areaServed": "CA-QC",
    "description": "Conseiller en sécurité financière affilié à iA Groupe financier. Épargne, assurances et solutions pour entreprises.",
    "founder": {
      "@type": "Person",
      "name": "Marc-Olivier Tessier",
      "jobTitle": "Conseiller en sécurité financière",
      "worksFor": {"@type": "Organization", "name": "iA Groupe financier"}
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
